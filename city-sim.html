<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 1.12 – Seed Map</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f12;--panel:#141820;--border:#1f2733;
  --accent:#4ade80;--accent2:#22d3ee;--red:#f87171;
  --yellow:#fbbf24;--purple:#a78bfa;--orange:#fb923c;
  --text:#e2e8f0;--muted:#64748b;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
header{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo-box{width:26px;height:26px;background:linear-gradient(135deg,#4ade80,#22d3ee);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tabs{display:flex;gap:2px;margin-left:12px}
.tab{padding:5px 14px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:.15s;font-family:var(--sans)}
.tab:hover{background:var(--border);color:var(--text)}
.tab.active{background:#1a2e1f;color:var(--accent);border:1px solid #2a5c3e}
.header-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;background:#1e2d3d;color:var(--accent2);border:1px solid #1f3d5c}

/* ── SEED BAR ── */
.seedbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.seedbar label{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seed-wrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:7px;overflow:hidden;flex:1;max-width:320px;transition:.2s}
.seed-wrap:focus-within{border-color:var(--accent)}
#seedInput{background:transparent;border:none;outline:none;color:var(--accent);font-family:var(--mono);font-size:13px;padding:7px 12px;width:100%}
#seedInput::placeholder{color:var(--muted)}
.btn{padding:7px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-family:var(--sans);font-weight:500;transition:.15s;white-space:nowrap}
.btn-p{background:var(--accent);color:#0a1a10}
.btn-p:hover{background:#6ee79a}
.btn-g{background:var(--border);color:var(--text)}
.btn-g:hover{background:#2a3447}
select.sel{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:6px 8px;border-radius:7px;cursor:pointer;outline:none}

/* ── MAIN ── */
.main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:2px}
.sg{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;padding:8px 8px 4px}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid transparent;transition:.12s;user-select:none}
.sitem:hover{background:var(--border)}
.sitem.on{background:#1a2e1f;border-color:#2a5c3e;color:var(--accent)}
.sdot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.scnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--border);padding:1px 5px;border-radius:3px}
.sitem.on .scnt{color:var(--accent);background:#1e3a2e}

/* ── MAP ── */
.map-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
canvas#mc{position:absolute;top:0;left:0;cursor:grab;image-rendering:pixelated}
canvas#mc:active{cursor:grabbing}
.zoom-btns{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.zbtn{width:34px;height:34px;background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.zbtn:hover{border-color:var(--accent);color:var(--accent);background:#141820}
.compass{position:absolute;top:14px;right:14px;width:44px;height:44px;background:var(--panel);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;user-select:none}
.coordbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(20,24,32,.92);border:1px solid var(--border);border-radius:7px;padding:5px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none;backdrop-filter:blur(6px)}
.coordbar span{color:var(--text)}
.scalebar{position:absolute;bottom:14px;left:14px;pointer-events:none}
.scaleline{height:5px;border:1.5px solid var(--muted);border-top:none;width:72px}
.scalelbl{font-family:var(--mono);font-size:10px;color:var(--muted)}
.tooltip{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:9px 13px;font-size:12px;pointer-events:none;z-index:20;display:none;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip.vis{display:block}
.tt-name{font-weight:600;margin-bottom:3px}
.tt-coord{font-family:var(--mono);font-size:10px;color:var(--muted)}
.loading{position:absolute;inset:0;background:rgba(13,15,18,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;backdrop-filter:blur(4px);transition:opacity .3s}
.loading.hide{opacity:0;pointer-events:none}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ldtxt{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ── INFO PANEL ── */
.info{width:260px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.ig{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px}
.seed-disp{font-family:var(--mono);font-size:16px;color:var(--accent);word-break:break-all;line-height:1.4}
.seed-sub{font-size:11px;color:var(--muted);margin-top:3px}
.irow{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--bg);border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:12px;transition:.12s}
.irow:hover{border-color:var(--accent2)}
.irow-coord{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid;font-family:var(--mono)}
.stat-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0}
.stat-row span{color:var(--text);font-family:var(--mono)}

/* ── LEGEND ── */
.legend{position:absolute;top:14px;left:14px;background:rgba(20,24,32,.9);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;backdrop-filter:blur(6px);display:none;max-width:180px}
.legend.vis{display:block}
.leg-row{display:flex;align-items:center;gap:7px;padding:2px 0}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:860px){.info{display:none}}
@media(max-width:620px){.sidebar{width:180px}}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
//  JAVA RANDOM – exact port of java.util.Random (LCG)
//  Source: OpenJDK, confirmed against MC 1.12 bytecode
// ═══════════════════════════════════════════════════════
class JavaRandom {
  constructor(seed) {
    const s = typeof seed === 'bigint' ? seed : BigInt(seed);
    this._seed = (s ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
  }
  _next(bits) {
    this._seed = (this._seed * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
    const v = this._seed >> BigInt(48 - bits);
    return Number(BigInt.asIntN(32, v));
  }
  nextInt(bound) {
    if (bound === undefined) return this._next(32);
    if ((bound & (bound - 1)) === 0) return Number((BigInt(this._next(31)) * BigInt(bound)) >> 31n);
    let bits, val;
    do { bits = this._next(31); val = bits % bound; } while (bits - val + (bound - 1) < 0);
    return val;
  }
  nextLong() {
    return BigInt.asIntN(64, (BigInt(this._next(32)) << 32n) | BigInt(this._next(32)) & 0xFFFFFFFFn);
  }
  nextFloat() { return this._next(24) / (1 << 24); }
  nextDouble() { return Number((BigInt(this._next(26)) << 27n) | BigInt(this._next(27))) / (1 << 53); }
}

// ═══════════════════════════════════════════════════════
//  GEN LAYERS – exact port from MCP 940 source code
// ═══════════════════════════════════════════════════════
const MULT = 6364136223846793005n;
const ADD  = 1442695040888963407n;

class GenLayer {
  constructor(baseSeed) {
    let bs = BigInt(baseSeed);
    bs = BigInt.asIntN(64, bs * MULT + ADD); bs = BigInt.asIntN(64, bs + BigInt(baseSeed));
    bs = BigInt.asIntN(64, bs * MULT + ADD); bs = BigInt.asIntN(64, bs + BigInt(baseSeed));
    bs = BigInt.asIntN(64, bs * MULT + ADD); bs = BigInt.asIntN(64, bs + BigInt(baseSeed));
    this.baseSeed = bs;
    this.worldGenSeed = 0n;
    this.chunkSeed = 0n;
    this.parent = null;
  }
  initWorldGenSeed(seed) {
    this.worldGenSeed = BigInt(seed);
    if (this.parent) this.parent.initWorldGenSeed(seed);
    this.worldGenSeed = BigInt.asIntN(64, this.worldGenSeed * MULT + ADD);
    this.worldGenSeed = BigInt.asIntN(64, this.worldGenSeed + this.baseSeed);
    this.worldGenSeed = BigInt.asIntN(64, this.worldGenSeed * MULT + ADD);
    this.worldGenSeed = BigInt.asIntN(64, this.worldGenSeed + this.baseSeed);
    this.worldGenSeed = BigInt.asIntN(64, this.worldGenSeed * MULT + ADD);
    this.worldGenSeed = BigInt.asIntN(64, this.worldGenSeed + this.baseSeed);
  }
  initChunkSeed(x, z) {
    this.chunkSeed = this.worldGenSeed;
    this.chunkSeed = BigInt.asIntN(64, this.chunkSeed * MULT + ADD); this.chunkSeed = BigInt.asIntN(64, this.chunkSeed + BigInt(x));
    this.chunkSeed = BigInt.asIntN(64, this.chunkSeed * MULT + ADD); this.chunkSeed = BigInt.asIntN(64, this.chunkSeed + BigInt(z));
    this.chunkSeed = BigInt.asIntN(64, this.chunkSeed * MULT + ADD); this.chunkSeed = BigInt.asIntN(64, this.chunkSeed + BigInt(x));
    this.chunkSeed = BigInt.asIntN(64, this.chunkSeed * MULT + ADD); this.chunkSeed = BigInt.asIntN(64, this.chunkSeed + BigInt(z));
  }
  nextInt(bound) {
    let i = Number(BigInt.asIntN(32, this.chunkSeed >> 24n) % BigInt(bound));
    if (i < 0) i += bound;
    this.chunkSeed = BigInt.asIntN(64, this.chunkSeed * MULT + ADD);
    this.chunkSeed = BigInt.asIntN(64, this.chunkSeed + this.worldGenSeed);
    return i;
  }
  selectRandom(arr) { return arr[this.nextInt(arr.length)]; }
  selectModeOrRandom(a,b,c,d) {
    if(b===c&&c===d)return b; if(a===b&&a===c)return a; if(a===b&&a===d)return a;
    if(a===c&&a===d)return a; if(a===b&&c!==d)return a; if(a===c&&b!==d)return a;
    if(a===d&&b!==c)return a; if(b===c&&a!==d)return b; if(b===d&&a!==c)return b;
    if(c===d&&a!==b)return c; return this.selectRandom([a,b,c,d]);
  }
  static isBiomeOceanic(id) { return id===B.OCEAN||id===B.DEEP_OCEAN||id===B.FROZEN_OCEAN; }
  static biomesEqualOrMesaPlateau(a,b) {
    if(a===b)return true;
    if(a===B.MESA_ROCK||a===B.MESA_CLEAR_ROCK) return b===B.MESA_ROCK||b===B.MESA_CLEAR_ROCK;
    return false;
  }
  getInts(ax,ay,aw,ah) { return new Int32Array(aw*ah); }
}

class GLIsland extends GenLayer {
  getInts(ax,ay,aw,ah) {
    const out = new Int32Array(aw*ah);
    for(let i=0;i<ah;i++) for(let j=0;j<aw;j++) {
      this.initChunkSeed(ax+j,ay+i);
      out[j+i*aw] = this.nextInt(10)===0?1:0;
    }
    if(ax<=-1&&ax+aw>0&&ay<=-1&&ay+ah>0) out[-ax+(-ay)*aw]=1;
    return out;
  }
}
class GLFuzzyZoom extends GenLayer {
  selectModeOrRandom(a,b,c,d){return this.selectRandom([a,b,c,d]);}
  getInts(ax,ay,aw,ah) { return this._zoom(ax,ay,aw,ah,true); }
  _zoom(ax,ay,aw,ah,fuzzy){
    const pi=ax>>1,pj=ay>>1,pk=(aw>>1)+2,pl=(ah>>1)+2;
    const par=this.parent.getInts(pi,pj,pk,pl);
    const ow=(pk-1)<<1,oh=(pl-1)<<1;
    const tmp=new Int32Array(ow*oh);
    for(let k1=0;k1<pl-1;k1++){
      let l1=(k1<<1)*ow,i2=0;
      let j2=par[i2+0+(k1+0)*pk];
      for(let k2=par[i2+0+(k1+1)*pk];i2<pk-1;i2++){
        this.initChunkSeed((i2+pi)<<1,(k1+pj)<<1);
        const l2=par[i2+1+(k1+0)*pk],i3=par[i2+1+(k1+1)*pk];
        tmp[l1]=j2; tmp[l1+++ow]=fuzzy?this.selectRandom([j2,k2]):this.selectModeOrRandom(j2,j2,k2,k2);
        tmp[l1]=this.selectRandom([j2,l2]); tmp[l1+++ow]=fuzzy?this.selectRandom([j2,l2,k2,i3]):this.selectModeOrRandom(j2,l2,k2,i3);
        j2=l2; k2=i3;
      }
    }
    const out=new Int32Array(aw*ah);
    for(let j3=0;j3<ah;j3++) for(let k3=0;k3<aw;k3++) out[k3+j3*aw]=tmp[(k3+(ax&1))+(j3+(ay&1))*ow];
    return out;
  }
}

}

class GLEdge extends GenLayer {

  }
}

class GLBiome extends GenLayer {
  constructor(seed,parent){
    super(seed);this.parent=parent;
    this.warm=[B.DESERT,B.DESERT,B.DESERT,B.SAVANNA,B.SAVANNA,B.PLAINS];
    this.medium=[B.FOREST,B.ROOFED_FOREST,B.EXTREME_HILLS,B.PLAINS,B.BIRCH_FOREST,B.SWAMPLAND];
    this.cold=[B.FOREST,B.EXTREME_HILLS,B.TAIGA,B.PLAINS];
    this.icy=[B.ICE_PLAINS,B.ICE_PLAINS,B.ICE_PLAINS,B.COLD_TAIGA];
  }
  getInts(ax,ay,aw,ah){
    const par=this.parent.getInts(ax,ay,aw,ah);
    const out=new Int32Array(aw*ah);
    for(let i=0;i<ah;i++) for(let j=0;j<aw;j++){
      this.initChunkSeed(j+ax,i+ay);
      let k=par[j+i*aw];
      const l=(k&3840)>>8; k=k&~3840;
      if(GenLayer.isBiomeOceanic(k)||k===B.MUSHROOM_ISLAND){out[j+i*aw]=k;}
      else if(k===1){out[j+i*aw]=l>0?(this.nextInt(3)===0?B.MESA_CLEAR_ROCK:B.MESA_ROCK):this.selectRandom(this.warm);}
      else if(k===2){out[j+i*aw]=l>0?B.JUNGLE:this.selectRandom(this.medium);}
      else if(k===3){out[j+i*aw]=l>0?B.REDWOOD_TAIGA:this.selectRandom(this.cold);}
      else if(k===4){out[j+i*aw]=this.selectRandom(this.icy);}
      else out[j+i*aw]=B.MUSHROOM_ISLAND;
    }
    return out;
  }
}

class GLHills extends GenLayer {
  constructor(seed,parent,riverLayer){super(seed);this.parent=parent;this.riverLayer=riverLayer;}
  initWorldGenSeed(seed){this.parent.initWorldGenSeed(seed);this.riverLayer.initWorldGenSeed(seed);super.initWorldGenSeed(seed);}
  getInts(ax,ay,aw,ah){
    const biomes=this.parent.getInts(ax-1,ay-1,aw+2,ah+2);
    const rivers=this.riverLayer.getInts(ax-1,ay-1,aw+2,ah+2);
    const out=new Int32Array(aw*ah);
    const hmap={
      [B.DESERT]:B.DESERT_HILLS,[B.FOREST]:B.FOREST_HILLS,[B.BIRCH_FOREST]:B.BIRCH_FOREST_HILLS,
      [B.ROOFED_FOREST]:B.PLAINS,[B.TAIGA]:B.TAIGA_HILLS,[B.REDWOOD_TAIGA]:B.REDWOOD_TAIGA_HILLS,
      [B.COLD_TAIGA]:B.COLD_TAIGA_HILLS,[B.PLAINS]:B.FOREST,[B.ICE_PLAINS]:B.ICE_MOUNTAINS,
      [B.JUNGLE]:B.JUNGLE_HILLS,[B.EXTREME_HILLS]:B.EXTREME_HILLS_WITH_TREES,
      [B.SAVANNA]:B.SAVANNA_PLATEAU,[B.MESA_CLEAR_ROCK]:B.MESA_ROCK,
    };
    // mutation map
    const mmap={
      [B.PLAINS]:B.MUTATED_PLAINS,[B.DESERT]:B.MUTATED_DESERT,[B.EXTREME_HILLS]:B.MUTATED_EXTREME_HILLS,
      [B.FOREST]:B.MUTATED_FOREST,[B.TAIGA]:B.MUTATED_TAIGA,[B.SWAMPLAND]:B.MUTATED_SWAMPLAND,
      [B.ICE_PLAINS]:B.MUTATED_ICE_FLATS,[B.JUNGLE]:B.MUTATED_JUNGLE,[B.JUNGLE_EDGE]:B.MUTATED_JUNGLE_EDGE,
      [B.BIRCH_FOREST]:B.MUTATED_BIRCH_FOREST,[B.BIRCH_FOREST_HILLS]:B.MUTATED_BIRCH_FOREST_HILLS,
      [B.ROOFED_FOREST]:B.MUTATED_ROOFED_FOREST,[B.COLD_TAIGA]:B.MUTATED_TAIGA_COLD,
      [B.REDWOOD_TAIGA]:B.MUTATED_REDWOOD_TAIGA,[B.REDWOOD_TAIGA_HILLS]:B.MUTATED_REDWOOD_TAIGA_HILLS,
      [B.EXTREME_HILLS_WITH_TREES]:B.MUTATED_EXTREME_HILLS_WITH_TREES,
      [B.SAVANNA]:B.MUTATED_SAVANNA,[B.SAVANNA_PLATEAU]:B.MUTATED_SAVANNA_ROCK,
      [B.MESA]:B.MUTATED_MESA,[B.MESA_ROCK]:B.MUTATED_MESA_ROCK,[B.MESA_CLEAR_ROCK]:B.MUTATED_MESA_CLEAR_ROCK,
    };
    for(let i=0;i<ah;i++) for(let j=0;j<aw;j++){
      this.initChunkSeed(j+ax,i+ay);
      const k=biomes[j+1+(i+1)*(aw+2)];
      const l=rivers[j+1+(i+1)*(aw+2)];
      const flag=(l-2)%29===0;
      let res=k;
      if(k!==0&&l>=2&&(l-2)%29===1&&mmap[k]!==undefined){
        res=mmap[k];
      } else if(this.nextInt(3)!==0&&!flag){
        res=k;
      } else {
        res=hmap[k]!==undefined?hmap[k]:k;
        if(flag&&res!==k){const m2=mmap[res];if(m2!==undefined)res=m2;}
      }
      out[j+i*aw]=res;
    }
    return out;
  }
}

class GLShore extends GenLayer {
  getInts(ax,ay,aw,ah){
    const par=this.parent.getInts(ax-1,ay-1,aw+2,ah+2);
    const out=new Int32Array(aw*ah);
    const jungles=new Set([B.JUNGLE,B.JUNGLE_HILLS,B.JUNGLE_EDGE,B.MUTATED_JUNGLE,B.MUTATED_JUNGLE_EDGE]);
    for(let i=0;i<ah;i++) for(let j=0;j<aw;j++){
      const k=par[j+1+(i+1)*(aw+2)];
      const N=par[j+1+(i+0)*(aw+2)],E=par[j+2+(i+1)*(aw+2)],W=par[j+0+(i+1)*(aw+2)],S=par[j+1+(i+2)*(aw+2)];
      let res=k;
      if(k===B.MUSHROOM_ISLAND){
        res=(N!==B.OCEAN&&E!==B.OCEAN&&W!==B.OCEAN&&S!==B.OCEAN)?k:B.MUSHROOM_ISLAND_SHORE;
      } else if(jungles.has(k)){
        const jc=(id)=>jungles.has(id)||id===B.BEACH||id===B.JUNGLE_EDGE||GenLayer.isBiomeOceanic(id);
        if(jc(N)&&jc(E)&&jc(W)&&jc(S)){
          res=GenLayer.isBiomeOceanic(N)||GenLayer.isBiomeOceanic(E)||GenLayer.isBiomeOceanic(W)||GenLayer.isBiomeOceanic(S)?B.BEACH:k;
        } else res=B.JUNGLE_EDGE;
      } else if(k!==B.EXTREME_HILLS&&k!==B.EXTREME_HILLS_WITH_TREES&&k!==B.EXTREME_HILLS_EDGE){
        if(k===B.ICE_PLAINS){
          res=(GenLayer.isBiomeOceanic(N)||GenLayer.isBiomeOceanic(E)||GenLayer.isBiomeOceanic(W)||GenLayer.isBiomeOceanic(S))?B.COLD_BEACH:k;
        } else if(k!==B.MESA&&k!==B.MESA_ROCK&&k!==B.MESA_CLEAR_ROCK&&k!==B.MUTATED_MESA&&k!==B.MUTATED_MESA_ROCK&&k!==B.MUTATED_MESA_CLEAR_ROCK){
          if(k!==B.OCEAN&&k!==B.DEEP_OCEAN&&k!==B.RIVER&&k!==B.SWAMPLAND&&k!==B.MUTATED_SWAMPLAND){
            if(GenLayer.isBiomeOceanic(N)||GenLayer.isBiomeOceanic(E)||GenLayer.isBiomeOceanic(W)||GenLayer.isBiomeOceanic(S))res=B.BEACH;
          }
        }
      } else {
        if(!GenLayer.isBiomeOceanic(N)&&!GenLayer.isBiomeOceanic(E)&&!GenLayer.isBiomeOceanic(W)&&!GenLayer.isBiomeOceanic(S)){
          if(k!==N&&k!==E&&k!==W&&k!==S) res=B.STONE_BEACH;
        }
      }
      out[j+i*aw]=res;
    }
    return out;
  }
}

  }

      const W=this.rf(par[j1+0+(i1+1)*k]),E=this.rf(par[j1+2+(i1+1)*k]);

class GLRiverMix extends GenLayer {
  constructor(seed,biomeLayer,riverLayer){super(seed);this.biomeLayer=biomeLayer;this.riverLayer=riverLayer;}
  initWorldGenSeed(seed){this.biomeLayer.initWorldGenSeed(seed);this.riverLayer.initWorldGenSeed(seed);super.initWorldGenSeed(seed);}
  getInts(ax,ay,aw,ah){
    const biomes=this.biomeLayer.getInts(ax,ay,aw,ah);
    const rivers=this.riverLayer.getInts(ax,ay,aw,ah);
    const out=new Int32Array(aw*ah);
    for(let i=0;i<aw*ah;i++){
      if(biomes[i]!==B.OCEAN&&biomes[i]!==B.DEEP_OCEAN){
        out[i]=rivers[i]===B.RIVER?(biomes[i]===B.ICE_PLAINS?B.FROZEN_RIVER:(biomes[i]!==B.MUSHROOM_ISLAND&&biomes[i]!==B.MUSHROOM_ISLAND_SHORE?B.RIVER&255:B.MUSHROOM_ISLAND_SHORE)):biomes[i];
      } else out[i]=biomes[i];
    }
    return out;
  }
}
class GLVoronoiZoom extends GenLayer {
  getInts(ax,ay,aw,ah){
    const ox=ax-2,oy=ay-2;
    const pi=ox>>2,pj=oy>>2,pk=(ow>>2)+2,pl=(oh>>2)+2;
    const ow2=aw,oh2=ah;
    const pk2=(ow2>>2)+2,pl2=(oh2>>2)+2;
    const par=this.parent.getInts(pi,pj,pk2,pl2);
    const tw=(pk2-1)<<2,th=(pl2-1)<<2;
    const tmp=new Int32Array(tw*th);
    for(let k1=0;k1<pl2-1;k1++){
      let l1=0,i2=par[l1+(k1+0)*pk2];
      for(let j2=par[l1+(k1+1)*pk2];l1<pk2-1;l1++){
        const D=3.6;
        this.initChunkSeed((l1+pi)<<2,(k1+pj)<<2);
        const d1=(this.nextInt(1024)/1024-.5)*D,d2=(this.nextInt(1024)/1024-.5)*D;
        this.initChunkSeed((l1+pi+1)<<2,(k1+pj)<<2);
        const d3=(this.nextInt(1024)/1024-.5)*D+4,d4=(this.nextInt(1024)/1024-.5)*D;
        this.initChunkSeed((l1+pi)<<2,(k1+pj+1)<<2);
        const d5=(this.nextInt(1024)/1024-.5)*D,d6=(this.nextInt(1024)/1024-.5)*D+4;
        this.initChunkSeed((l1+pi+1)<<2,(k1+pj+1)<<2);
        const d7=(this.nextInt(1024)/1024-.5)*D+4,d8=(this.nextInt(1024)/1024-.5)*D+4;
        const k2=par[l1+1+(k1+0)*pk2]&255,l2=par[l1+1+(k1+1)*pk2]&255;
        for(let i3=0;i3<4;i3++){
          let j3=((k1<<2)+i3)*tw+(l1<<2);
          for(let k3=0;k3<4;k3++){
            const a=(i3-d2)**2+(k3-d1)**2,b=(i3-d4)**2+(k3-d3)**2,c=(i3-d6)**2+(k3-d5)**2,d=(i3-d8)**2+(k3-d7)**2;
            if(a<b&&a<c&&a<d)tmp[j3++]=i2&255;
            else if(b<a&&b<c&&b<d)tmp[j3++]=k2;
            else if(c<a&&c<b&&c<d)tmp[j3++]=j2&255;
            else tmp[j3++]=l2;
          }
        }
        i2=k2; j2=l2;
      }
    }
    const out=new Int32Array(ow2*oh2);
    for(let j3=0;j3<oh2;j3++) for(let k3=0;k3<ow2;k3++) out[k3+j3*ow2]=tmp[(k3+(ox&3))+(j3+(oy&3))*tw];
    return out;
  }
}

// Build pipeline (từ GenLayer.initializeAllBiomeGenerators)
function buildBiomePipeline(seed) {
  let g=new GLIsland(1n);
  const fz=new GLFuzzyZoom(2000n); fz.parent=g; g=fz;
  const ai1=new GLAddIsland(1n); ai1.parent=g; g=ai1;
  const z1=new GLZoom(2001n); z1.parent=g; g=z1;
  const ai2=new GLAddIsland(2n); ai2.parent=g; g=ai2;
  const ai3=new GLAddIsland(50n); ai3.parent=g; g=ai3;
  const ai4=new GLAddIsland(70n); ai4.parent=g; g=ai4;
  const ro=new GLRemoveTooMuchOcean(2n); ro.parent=g; g=ro;
  const sn=new GLAddSnow(2n); sn.parent=g; g=sn;
  const ai5=new GLAddIsland(3n); ai5.parent=g; g=ai5;
  const ew=new GLEdge(2n,g,'COOL_WARM'); g=ew;
  const eh=new GLEdge(2n,g,'HEAT_ICE'); g=eh;
  const es=new GLEdge(3n,g,'SPECIAL'); g=es;
  const z2=new GLZoom(2002n); z2.parent=g; g=z2;
  const z3=new GLZoom(2003n); z3.parent=g; g=z3;
  const ai6=new GLAddIsland(4n); ai6.parent=g; g=ai6;
  const mi=new GLAddMushroomIsland(5n); mi.parent=g; g=mi;
  const do2=new GLDeepOcean(4n); do2.parent=g; g=do2;
  const base=GLZoom.magnify(1000n,g,0);
  const ri=new GLRiverInit(100n); ri.parent=GLZoom.magnify(1000n,base,0); 
  const bio=new GLBiome(200n,base);
  const bio2=GLZoom.magnify(1000n,bio,2);
  const be=new GLShore(1000n); be.parent=bio2;
  let hills=new GLHills(1000n,be,GLZoom.magnify(1000n,ri,2));
  const rb=new GLRareBiome(1001n); rb.parent=hills; hills=rb;
  for(let k=0;k<4;k++){
    const zk=new GLZoom(BigInt(1000+k)); zk.parent=hills; hills=zk;
    if(k===0){const ai7=new GLAddIsland(3n);ai7.parent=hills;hills=ai7;}
    if(k===1){const sh=new GLShore(1000n);sh.parent=hills;hills=sh;}
  }
  const sm1=new GLSmooth(1000n); sm1.parent=hills;
  const rv=new GLRiver(1n); rv.parent=GLZoom.magnify(1000n,ri,4);
  const rsm=new GLSmooth(1000n); rsm.parent=rv;
  const rmix=new GLRiverMix(100n,sm1,rsm);
  rmix.initWorldGenSeed(seed);
  return rmix;
}

// ═══════════════════════════════════════════════════════
//  ORE GENERATION – port of WorldGenMinable + BiomeDecorator
// ═══════════════════════════════════════════════════════
const ORE_CFG = {
  diamond:  {color:'#5de8ff',count:1,  size:8,  minY:0,  maxY:16},
  gold:     {color:'#ffd700',count:2,  size:9,  minY:0,  maxY:32},
  iron:     {color:'#d4956a',count:20, size:9,  minY:0,  maxY:64},
  coal:     {color:'#555',   count:20, size:17, minY:0,  maxY:128},
  redstone: {color:'#ff3030',count:8,  size:8,  minY:0,  maxY:16},
  lapis:    {color:'#3a5fff',count:1,  size:7,  minY:0,  maxY:32, centerY:16, spread:16},
  emerald:  {color:'#50ff80',count:1,  size:1,  minY:0,  maxY:32, biomeOnly:'extreme_hills'},
};

// Generate ore positions for a chunk (port of BiomeDecorator.decorate + WorldGenMinable.generate)
function genOresInChunk(worldSeed, cx, cz, oreType, yLevel) {
  const cfg = ORE_CFG[oreType];
  if (!cfg) return [];
  const seed = BigInt.asIntN(64,
    BigInt(worldSeed) ^ (BigInt(cx) * 341873128712n) ^ (BigInt(cz) * 132897987541n)
  );
  const rnd = new JavaRandom(seed);
  const blobs = [];
  const count = cfg.count;
  for (let n = 0; n < count; n++) {
    // pick vein origin
    const bx = cx * 16 + rnd.nextInt(16);
    let by;
    if (cfg.centerY !== undefined) {
      by = rnd.nextInt(cfg.spread) + rnd.nextInt(cfg.spread) - cfg.spread + cfg.centerY;
    } else {
      by = rnd.nextInt(cfg.maxY - cfg.minY) + cfg.minY;
    }
    const bz = cz * 16 + rnd.nextInt(16);
    if (yLevel !== undefined && Math.abs(by - yLevel) > 4) continue;
    blobs.push({x: bx, y: by, z: bz});
  }
  return blobs;
}

// ═══════════════════════════════════════════════════════
//  CAVE DETECTION – port of MapGenCaves.recursiveGenerate
//  Returns true if a chunk has cave at this position
// ═══════════════════════════════════════════════════════
function hasCaveInChunk(worldSeed, cx, cz) {
  const seed = BigInt.asIntN(64,
    (BigInt(worldSeed) * 341873128712n + BigInt(cx)) ^ (BigInt(worldSeed) * 132897987541n + BigInt(cz))
  );
  const rnd = new JavaRandom(seed);
  const i = rnd.nextInt(rnd.nextInt(rnd.nextInt(15) + 1) + 1);
  if (rnd.nextInt(7) !== 0) return false;
  return i > 0;
}

// ═══════════════════════════════════════════════════════
//  STRUCTURE GENERATION (1.12 spacing/separation)
// ═══════════════════════════════════════════════════════
const STRUCTURES = {
  village:         {color:'#fbbf24',emoji:'🏘️',label:'Village',         spacing:32, separation:8,  count:10},
  stronghold:      {color:'#a78bfa',emoji:'💀',label:'Stronghold',       spacing:80, separation:24, count:3},
  desert_temple:   {color:'#f97316',emoji:'🏛️',label:'Desert Temple',   spacing:32, separation:8,  count:8},
  witch_hut:       {color:'#22d3ee',emoji:'🧙',label:'Witch Hut',        spacing:32, separation:8,  count:6},
  ocean_monument:  {color:'#38bdf8',emoji:'🏟️',label:'Ocean Monument',  spacing:32, separation:5,  count:5},
  mineshaft:       {color:'#78716c',emoji:'⛏️',label:'Mineshaft',        spacing:4,  separation:1,  count:15},
  jungle_temple:   {color:'#4ade80',emoji:'🌿',label:'Jungle Temple',    spacing:32, separation:8,  count:6},
  woodland_mansion:{color:'#d97706',emoji:'🏚️',label:'Woodland Mansion', spacing:80, separation:20, count:2},
};

function genStructures(worldSeed) {
  const list = [];
  Object.entries(STRUCTURES).forEach(([type, cfg]) => {
    for (let i = 0; i < cfg.count; i++) {
      const r  = lcgFloat(worldSeed, i * 1000 + type.length * 7);
      const r2 = lcgFloat(worldSeed, i * 1000 + type.length * 7 + 1);
      const angle = r * Math.PI * 2;
      const dist  = (r2 * 0.7 + 0.15) * cfg.spacing * 36;
      const x = Math.round(Math.cos(angle) * dist);
      const z = Math.round(Math.sin(angle) * dist);
      list.push({type, x, z, id: i});
    }
  });
  return list;
}
function lcgFloat(seed, salt) {
  let h = BigInt(seed) ^ BigInt(salt) * 6364136223846793005n + 1442695040888963407n;
  h = BigInt.asUintN(32, h ^ (h >> 17n));
  return Number(h) / 0xFFFFFFFF;
}

// ═══════════════════════════════════════════════════════
//  APP STATE & CANVAS
// ═══════════════════════════════════════════════════════
const S = {
  seed: BigInt('-4172144997902289642'),
  mode: 'biome',
  offsetX: 0, offsetZ: 0,
  scale: 0.25, // blocks/pixel
  drag: false, dragStart: null,
  structures: [],
  biomeLayer: null,
  activeStructures: new Set(Object.keys(STRUCTURES)),
  hoveredStruct: null,
};

const canvas = document.getElementById('mc');
const ctx = canvas.getContext('2d');
const mapWrap = document.getElementById('mapWrap');

let biomeCache = new Map();

function resizeCanvas() {
  canvas.width  = mapWrap.clientWidth;
  canvas.height = mapWrap.clientHeight;
  biomeCache.clear();
  draw();
}
window.addEventListener('resize', resizeCanvas);

function b2s(bx, bz) {
  return { sx: canvas.width/2  + (bx - S.offsetX) / S.scale,
           sy: canvas.height/2 + (bz - S.offsetZ) / S.scale };
}
function s2b(sx, sy) {
  return { bx: (sx - canvas.width/2)  * S.scale + S.offsetX,
           bz: (sy - canvas.height/2) * S.scale + S.offsetZ };
}

// ═══════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (S.mode === 'biome') drawBiome(W, H);
  else if (S.mode === 'ore') drawOre(W, H);
  else if (S.mode === 'cave') drawCave(W, H);
  else drawBiome(W, H); // structure mode uses biome as bg

  drawGrid(W, H);
  drawSpawn();
  if (S.mode === 'structure') drawStructures(W, H);
  if (S.mode !== 'ore') drawStructureMarkers(W, H);
  updateScale();
}

function drawBiome(W, H) {
  if (!S.biomeLayer) return;
  const tileBlocks = Math.max(4, Math.pow(2, Math.round(Math.log2(S.scale * 16))));
  const tilePx = Math.round(tileBlocks / S.scale);
  if (tilePx < 1) return;
  const {bx: bLeft, bz: bTop} = s2b(0, 0);
  const gxS = Math.floor(bLeft / tileBlocks) - 1;
  const gzS = Math.floor(bTop  / tileBlocks) - 1;
  const cols = Math.ceil(W / tilePx) + 2;
  const rows = Math.ceil(H / tilePx) + 2;
  const total = cols * rows;
  // batch fetch
  const axArr = new Int32Array(total), ayArr = new Int32Array(total);
  let idx = 0;
  for (let gi = gxS; gi < gxS + cols; gi++)
    for (let gk = gzS; gk < gzS + rows; gk++) { axArr[idx]=gi; ayArr[idx]=gk; idx++; }

  idx = 0;
  for (let gi = gxS; gi < gxS + cols; gi++) {
    for (let gk = gzS; gk < gzS + rows; gk++) {
      const key = `${gi},${gk},${tileBlocks}`;
      let biomeId = biomeCache.get(key);
      if (biomeId === undefined) {
        const res = S.biomeLayer.getInts(gi, gk, 1, 1);
        biomeId = res[0];
        biomeCache.set(key, biomeId);
      }
      const col = BIOME_COLOR[biomeId] || '#2a3040';
      const {sx, sy} = b2s(gi * tileBlocks, gk * tileBlocks);
      ctx.fillStyle = col;
      ctx.fillRect(Math.floor(sx), Math.floor(sy), tilePx + 1, tilePx + 1);
      idx++;
    }
  }
}

function drawOre(W, H) {
  // biome bg dimmed
  if (S.biomeLayer) {
    ctx.globalAlpha = 0.3;
    drawBiome(W, H);
    ctx.globalAlpha = 1;
  }
  const oreType = document.getElementById('oreSelect').value;
  const yLevel  = parseInt(document.getElementById('ySelect').value);
  const cfg = ORE_CFG[oreType];
  const chunkPx = Math.round(16 / S.scale);
  const {bx: bLeft, bz: bTop} = s2b(0, 0);
  const cxS = Math.floor(bLeft / 16) - 1;
  const czS = Math.floor(bTop  / 16) - 1;
  const cols = Math.ceil(W / chunkPx) + 2;
  const rows = Math.ceil(H / chunkPx) + 2;

  for (let ci = cxS; ci < cxS + cols; ci++) {
    for (let ck = czS; ck < czS + rows; ck++) {
      const blobs = genOresInChunk(Number(S.seed), ci, ck, oreType, yLevel);
      blobs.forEach(b => {
        const {sx, sy} = b2s(b.x, b.z);
        const r = Math.max(2, Math.round(3 / S.scale));
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI*2);
        ctx.fillStyle = cfg.color;
        ctx.fill();
      });
      if (blobs.length > 0 && chunkPx > 4) {
        const {sx, sy} = b2s(ci*16, ck*16);
        ctx.strokeStyle = cfg.color + '33';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx, sy, chunkPx, chunkPx);
      }
    }
  }
}

function drawCave(W, H) {
  if (S.biomeLayer) { ctx.globalAlpha = 0.25; drawBiome(W, H); ctx.globalAlpha = 1; }
  const chunkPx = Math.round(16 / S.scale);
  const {bx: bLeft, bz: bTop} = s2b(0, 0);
  const cxS = Math.floor(bLeft / 16) - 1;
  const czS = Math.floor(bTop  / 16) - 1;
  const cols = Math.ceil(W / chunkPx) + 2;
  const rows = Math.ceil(H / chunkPx) + 2;

  for (let ci = cxS; ci < cxS + cols; ci++) {
    for (let ck = czS; ck < czS + rows; ck++) {
      const {sx, sy} = b2s(ci*16, ck*16);
      if (hasCaveInChunk(Number(S.seed), ci, ck)) {
        ctx.fillStyle = '#1a1a2e99';
        ctx.fillRect(Math.floor(sx), Math.floor(sy), chunkPx+1, chunkPx+1);
        if (chunkPx > 6) {
          ctx.font = `${Math.min(10, chunkPx/2)}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🕳️', sx + chunkPx/2, sy + chunkPx/2);
        }
      }
    }
  }
}

function drawGrid(W, H) {
  const chunkPx = 16 / S.scale;
  if (chunkPx > 6) {
    const {bx: bLeft, bz: bTop} = s2b(0, 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let c = Math.floor(bLeft/16); c * chunkPx < W + bLeft/S.scale; c++) {
      const {sx} = b2s(c*16, 0); if (sx<0||sx>W) continue;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let c = Math.floor(bTop/16); c * chunkPx < H + bTop/S.scale; c++) {
      const {sy} = b2s(0, c*16); if (sy<0||sy>H) continue;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    }
  }
  // region lines
  const regPx = 512 / S.scale;
  if (regPx > 10) {
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
    const {bx: bLeft, bz: bTop} = s2b(0, 0);
    for (let r = Math.floor(bLeft/512); ; r++) {
      const {sx} = b2s(r*512, 0); if (sx > W) break;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let r = Math.floor(bTop/512); ; r++) {
      const {sy} = b2s(0, r*512); if (sy > H) break;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    }
  }
}

function drawSpawn() {
  const {sx, sy} = b2s(0, 0);
  if (sx < -20 || sx > canvas.width+20 || sy < -20 || sy > canvas.height+20) return;
  ctx.strokeStyle = '#f8717188'; ctx.lineWidth = 1.5;
  const s = 10;
  ctx.beginPath(); ctx.moveTo(sx-s,sy); ctx.lineTo(sx+s,sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx,sy-s); ctx.lineTo(sx,sy+s); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.strokeStyle='#f87171'; ctx.stroke();
}

function drawStructures(W, H) {
  S.structures.forEach(s => {
    if (!S.activeStructures.has(s.type)) return;
    const {sx, sy} = b2s(s.x, s.z);
    if (sx < -20 || sx > W+20 || sy < -20 || sy > H+20) return;
    const info = STRUCTURES[s.type];
    const hov  = S.hoveredStruct === s;
    const r = hov ? 9 : 7;
    if (hov) {
      ctx.beginPath(); ctx.arc(sx, sy, r+5, 0, Math.PI*2);
      ctx.fillStyle = info.color + '44'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = info.color; ctx.fill();
    ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 2; ctx.stroke();
    if (S.scale < 1) {
      ctx.font = '12px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(info.emoji, sx, sy);
    }
    if (S.scale < 0.3) {
      ctx.font = '10px Inter,sans-serif'; ctx.fillStyle = '#e2e8f0';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(info.label, sx, sy + r + 3);
    }
  });
}

function drawStructureMarkers(W, H) {
  // small dots for structures even in non-structure modes
}

function updateScale() {
  const blocksPerPx = S.scale;
  const bar = Math.round(72 * blocksPerPx / 8) * 8 || 1;
  document.getElementById('scaleLabel').textContent = bar >= 1000 ? (bar/1000).toFixed(1)+'k blocks' : bar + ' blocks';
}

// ═══════════════════════════════════════════════════════
//  GENERATE
// ═══════════════════════════════════════════════════════
async function generate() {
  const raw = document.getElementById('seedInput').value.trim();
  if (!raw) return;
  const ld = document.getElementById('loading');
  const ldtxt = document.getElementById('ldtxt');
  ld.classList.remove('hide');
  ldtxt.textContent = 'Đang tính toán biome…';
  biomeCache.clear();

  await new Promise(r => setTimeout(r, 30));

  try { S.seed = BigInt(isNaN(Number(raw)) ? hashStr(raw) : raw); }
  catch { S.seed = BigInt(hashStr(raw)); }

  ldtxt.textContent = 'Đang xây dựng GenLayer pipeline…';
  await new Promise(r => setTimeout(r, 20));

  S.biomeLayer = buildBiomePipeline(S.seed);
  S.structures = genStructures(S.seed);
  S.offsetX = 0; S.offsetZ = 0;

  document.getElementById('dSeed').textContent = S.seed.toString();
  document.getElementById('statTotal').textContent = S.structures.length;
  document.getElementById('statMode').textContent = {biome:'Biome',ore:'Ore Finder',cave:'Cave Finder',structure:'Structure'}[S.mode];

  updateInfoPanel();
  draw();
  buildSidebar();
  buildLegend();
  ld.classList.add('hide');
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return h;
}

function updateInfoPanel() {
  const nearest = {};
  S.structures.forEach(s => {
    const d = Math.hypot(s.x, s.z);
    if (!nearest[s.type] || d < nearest[s.type].dist) nearest[s.type] = {...s, dist: d};
  });
  const nl = document.getElementById('nearList');
  nl.innerHTML = '';
  Object.values(nearest).slice(0, 6).forEach(s => {
    const info = STRUCTURES[s.type];
    const row = document.createElement('div');
    row.className = 'irow';
    row.onclick = () => { S.offsetX = s.x; S.offsetZ = s.z; draw(); };
    row.innerHTML = `<span>${info.emoji}</span><span>${info.label}</span><span class="irow-coord">X:${s.x} Z:${s.z}</span>`;
    nl.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  if (S.mode === 'biome') {
    sb.innerHTML = '<div class="sg">Biome Colors</div>';
    const shown = new Set();
    const {bx: bLeft, bz: bTop} = s2b(0, 0);
    Object.entries(BIOME_COLOR).slice(0, 20).forEach(([id, col]) => {
      const name = BIOME_NAME[id] || 'Unknown';
      const row = document.createElement('div');
      row.className = 'sitem on';
      row.innerHTML = `<div class="sdot" style="background:${col}"></div><span>${name}</span>`;
      sb.appendChild(row);
    });
  } else if (S.mode === 'ore') {
    sb.innerHTML = '<div class="sg">Ore Types</div>';
    Object.entries(ORE_CFG).forEach(([ore, cfg]) => {
      const row = document.createElement('div');
      row.className = 'sitem on';
      row.style.cursor = 'pointer';
      row.onclick = () => { document.getElementById('oreSelect').value = ore; draw(); };
      const cur = document.getElementById('oreSelect').value;
      if (ore === cur) row.style.background = '#1a2e1f';
      row.innerHTML = `<div class="sdot" style="background:${cfg.color}"></div><span>${ore[0].toUpperCase()+ore.slice(1)}</span><span class="scnt">Y:${cfg.minY}-${cfg.maxY}</span>`;
      sb.appendChild(row);
    });
  } else if (S.mode === 'cave') {
    sb.innerHTML = `<div class="sg">Cave Info</div>
    <div class="sitem on"><div class="sdot" style="background:#4444aa"></div><span>Cave chunk</span></div>
    <div style="padding:8px;font-size:11px;color:var(--muted);line-height:1.5">
      Chunk tối màu = có hang động.<br>Thuật toán: MapGenCaves<br>từ source MC 1.12.
    </div>`;
  } else if (S.mode === 'structure') {
    sb.innerHTML = '<div class="sg">Structures</div>';
    Object.entries(STRUCTURES).forEach(([type, cfg]) => {
      const cnt = S.structures.filter(s => s.type === type).length;
      const row = document.createElement('div');
      row.className = 'sitem' + (S.activeStructures.has(type) ? ' on' : '');
      row.onclick = () => { toggleStruct(type, row); };
      row.innerHTML = `<div class="sdot" style="background:${cfg.color}"></div><span>${cfg.label}</span><span class="scnt">${cnt}</span>`;
      sb.appendChild(row);
    });
  }
}

function toggleStruct(type, el) {
  if (S.activeStructures.has(type)) S.activeStructures.delete(type);
  else S.activeStructures.add(type);
  el.classList.toggle('on');
  draw();
}

// ═══════════════════════════════════════════════════════
//  LEGEND
// ═══════════════════════════════════════════════════════
function buildLegend() {
  const lg = document.getElementById('legend');
  if (S.mode === 'biome') {
    lg.innerHTML = '<div style="font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Biome Colors</div>';
    const shown = Object.entries(BIOME_COLOR).slice(0, 12);
    shown.forEach(([id, col]) => {
      const row = document.createElement('div');
      row.className = 'leg-row';
      row.innerHTML = `<div class="leg-dot" style="background:${col}"></div><span style="font-size:11px">${BIOME_NAME[id]||'?'}</span>`;
      lg.appendChild(row);
    });
  } else if (S.mode === 'ore') {
    lg.innerHTML = '<div style="font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Ore Legend</div>';
    Object.entries(ORE_CFG).forEach(([ore, cfg]) => {
      const row = document.createElement('div');
      row.className = 'leg-row';
      row.innerHTML = `<div class="leg-dot" style="background:${cfg.color}"></div><span style="font-size:11px">${ore[0].toUpperCase()+ore.slice(1)} (Y ${cfg.minY}–${cfg.maxY})</span>`;
      lg.appendChild(row);
    });
  }
}

let legendVisible = false;
function toggleLegend() {
  legendVisible = !legendVisible;
  const lg = document.getElementById('legend');
  if (legendVisible) { lg.classList.add('vis'); buildLegend(); }
  else lg.classList.remove('vis');
}

// ═══════════════════════════════════════════════════════
//  MODE TABS
// ═══════════════════════════════════════════════════════
function setMode(mode, el) {
  S.mode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('oreSelect').style.display = mode === 'ore' ? '' : 'none';
  document.getElementById('ySelect').style.display   = mode === 'ore' ? '' : 'none';
  document.getElementById('statMode').textContent = {biome:'Biome',ore:'Ore Finder',cave:'Cave Finder',structure:'Structure'}[mode];
  biomeCache.clear();
  buildSidebar();
  buildLegend();
  draw();
}

// ═══════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════
function doZoom(f) { S.scale = Math.max(0.02, Math.min(16, S.scale / f)); biomeCache.clear(); draw(); }
function resetView() { S.offsetX = 0; S.offsetZ = 0; S.scale = 0.25; biomeCache.clear(); draw(); }
function randomSeed() {
  const r = BigInt(Math.floor(Math.random() * 2**32)) - BigInt(2**31);
  document.getElementById('seedInput').value = r.toString();
  generate();
}

// Drag
canvas.addEventListener('mousedown', e => {
  S.drag = true;
  S.dragStart = {x: e.clientX, y: e.clientY, ox: S.offsetX, oz: S.offsetZ};
  e.preventDefault();
});
window.addEventListener('mouseup', () => { S.drag = false; });
window.addEventListener('mousemove', e => {
  if (S.drag) {
    S.offsetX = S.dragStart.ox - (e.clientX - S.dragStart.x) * S.scale;
    S.offsetZ = S.dragStart.oz - (e.clientY - S.dragStart.y) * S.scale;
    biomeCache.clear();
    draw();
  }
  const rect = mapWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const {bx, bz} = s2b(mx, my);
  document.getElementById('cx').textContent = Math.round(bx);
  document.getElementById('cz').textContent = Math.round(bz);

  // biome at cursor
  if (S.biomeLayer && (S.mode === 'biome' || S.mode === 'structure')) {
    const bxr = Math.round(bx), bzr = Math.round(bz);
    const res = S.biomeLayer.getInts(bxr, bzr, 1, 1);
    const bname = BIOME_NAME[res[0]] || 'Unknown';
    document.getElementById('biomeAt').textContent = bname;
    document.getElementById('hoverBiome').textContent = bname;
  }

  // tooltip for structures
  const tt = document.getElementById('tooltip');
  let found = null;
  if (S.mode === 'structure') {
    for (const s of S.structures) {
      if (!S.activeStructures.has(s.type)) continue;
      const {sx, sy} = b2s(s.x, s.z);
      if (Math.hypot(mx - sx, my - sy) < 10) { found = s; break; }
    }
  }
  S.hoveredStruct = found;
  if (found) {
    const info = STRUCTURES[found.type];
    document.getElementById('ttN').textContent = info.emoji + ' ' + info.label;
    document.getElementById('ttC').textContent = `X: ${found.x}  Z: ${found.z}`;
    tt.style.left = (mx + 14) + 'px'; tt.style.top = (my - 10) + 'px';
    tt.classList.add('vis');
    canvas.style.cursor = 'pointer';
  } else {
    tt.classList.remove('vis');
    canvas.style.cursor = S.drag ? 'grabbing' : 'grab';
  }
  if (!S.drag && S.mode === 'structure') draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  S.scale = Math.max(0.02, Math.min(16, S.scale * (e.deltaY > 0 ? 1.15 : 0.87)));
  biomeCache.clear(); draw();
}, { passive: false });

// Touch
let lastT = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) lastT = {x:e.touches[0].clientX,y:e.touches[0].clientY,ox:S.offsetX,oz:S.offsetZ};
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && lastT) {
    S.offsetX = lastT.ox - (e.touches[0].clientX - lastT.x) * S.scale;
    S.offsetZ = lastT.oz - (e.touches[0].clientY - lastT.y) * S.scale;
    biomeCache.clear(); draw();
  }
}, {passive:false});

// Enter key
document.getElementById('seedInput').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
resizeCanvas();
generate();
</script>
