<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mô Phỏng Cuộc Đời AI</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #eee; margin:0; padding:20px; }
  .container { max-width: 900px; margin: auto; }
  h1 { text-align:center; color:#6cf; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:20px; }
  .card { background:#1a1d27; border-radius:12px; padding:16px; box-shadow:0 0 8px rgba(0,0,0,0.4); }
  .bar-bg { background:#333; border-radius:8px; overflow:hidden; height:20px; margin-top:6px; }
  .bar-fill { height:100%; transition: width 0.5s; }
  .health .bar-fill { background: linear-gradient(90deg,#e33,#5f5); }
  .money .bar-fill { background: linear-gradient(90deg,#f90,#ff0); }
  .stress .bar-fill { background: linear-gradient(90deg,#5af,#a5f); }
  #log { background:#111; border-radius:12px; padding:12px; height:220px; overflow-y:auto; font-size:14px; line-height:1.5; }
  #log div { margin-bottom:8px; border-bottom:1px solid #222; padding-bottom:6px; }
  .stat-label { font-size:13px; opacity:0.8; }
  .stat-value { font-size:22px; font-weight:bold; }
  button { background:#3a5; border:none; color:white; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:15px; margin:4px; }
  button:hover { background:#4c6; }
  button:disabled { background:#555; cursor:not-allowed; }
  .controls { text-align:center; margin:16px 0; }
  canvas { background:#1a1d27; border-radius:12px; }
  .pie-wrap { display:flex; align-items:center; gap:16px; }
  .legend div { display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:13px; }
  .swatch { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .dead { color:#f55; font-weight:bold; }
</style>
</head>
<body>
<div class="container">
  <h1>🧬 Mô Phỏng Cuộc Đời AI</h1>
  <div class="controls">
    <button id="startBtn">▶ Bắt đầu</button>
    <button id="pauseBtn" disabled>⏸ Tạm dừng</button>
    <button id="resetBtn">🔄 Reset</button>
    <span id="genInfo" style="margin-left:12px; opacity:0.7;"></span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="stat-label">Tuổi</div>
      <div class="stat-value" id="ageVal">1</div>
      <div class="stat-label" style="margin-top:10px;">Trạng thái hiện tại</div>
      <div class="stat-value" id="stateVal" style="font-size:16px;">Đang khởi tạo...</div>
    </div>

    <div class="card">
      <div class="money">
        <div class="stat-label">💰 Tiền mặt: <span id="cashVal">0</span> VNĐ</div>
      </div>
      <div class="stat-label" style="margin-top:8px;">🏦 Tiết kiệm: <span id="savingsVal">0</span> VNĐ</div>
      <div class="stat-label">📈 Chứng khoán: <span id="stockVal">0</span> VNĐ</div>
      <div class="stat-label">🏧 Nợ ngân hàng: <span id="debtVal">0</span> VNĐ (lãi <span id="interestVal">0</span>%)</div>
    </div>

    <div class="card health">
      <div class="stat-label">❤️ Sức khỏe</div>
      <div class="bar-bg"><div class="bar-fill" id="healthBar" style="width:100%;"></div></div>
      <div class="stat-label" style="margin-top:4px;" id="healthPct">100%</div>
    </div>

    <div class="card stress">
      <div class="stat-label">😵 Căng thẳng / Áp lực</div>
      <div class="bar-bg"><div class="bar-fill" id="stressBar" style="width:0%;"></div></div>
      <div class="stat-label" style="margin-top:4px;" id="stressPct">0%</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div class="pie-wrap">
      <canvas id="pieChart" width="180" height="180"></canvas>
      <div class="legend" id="pieLegend"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div class="stat-label">📜 Nhật ký cuộc đời</div>
    <div id="log"></div>
  </div>
</div>

<script>
// ====== CẤU HÌNH ======
const GROQ_API_KEY = "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"; // <-- thay bằng key thật
const GROQ_MODEL = "openai/gpt-oss-20b";
const TICK_MS = 30000; // 30s = 1 năm

// ====== STATE ======
let state = {
  generation: 1,
  age: 1,
  cash: 0,
  savings: 0,
  stock: 0,
  debt: 0,
  interestRate: 5, // %/năm, tăng dần
  health: 100,
  stress: 0,
  job: "Chưa có việc",
  salary: 0,
  status: "Ngủ",
  married: false,
  children: 0,
  eduLevel: "Chưa học",
  marketTrend: 0, // % thay đổi thị trường chứng khoán năm nay
  inflation: 3,
  timeSplit: { sleep: 40, work: 30, overtime: 10, rest: 20 }, // % trong năm
  history: []
};

let running = false;
let timer = null;

// ====== UI HELPERS ======
const el = id => document.getElementById(id);
function log(msg, isDeath=false) {
  const div = document.createElement('div');
  div.innerHTML = `<strong>[Tuổi ${state.age}]</strong> ${msg}`;
  if (isDeath) div.classList.add('dead');
  el('log').prepend(div);
}
function fmt(n) { return Math.round(n).toLocaleString('vi-VN'); }

function updateUI() {
  el('ageVal').textContent = state.age;
  el('cashVal').textContent = fmt(state.cash);
  el('savingsVal').textContent = fmt(state.savings);
  el('stockVal').textContent = fmt(state.stock);
  el('debtVal').textContent = fmt(state.debt);
  el('interestVal').textContent = state.interestRate.toFixed(1);
  el('stateVal').textContent = `${state.status} — ${state.job}`;
  el('healthBar').style.width = Math.max(0,state.health) + '%';
  el('healthPct').textContent = Math.round(state.health) + '%';
  el('stressBar').style.width = Math.min(100,state.stress) + '%';
  el('stressPct').textContent = Math.round(state.stress) + '%';
  el('genInfo').textContent = `Thế hệ #${state.generation}`;
  drawPie();
}

function drawPie() {
  const ctx = el('pieChart').getContext('2d');
  ctx.clearRect(0,0,180,180);
  const data = state.timeSplit;
  const labels = [['Ngủ','sleep','#5af'],['Làm việc','work','#3a5'],['Tăng ca','overtime','#f90'],['Nghỉ ngơi','rest','#a5f']];
  let total = data.sleep+data.work+data.overtime+data.rest;
  let start = -Math.PI/2;
  const legend = el('pieLegend');
  legend.innerHTML = '';
  labels.forEach(([name,key,color]) => {
    let slice = (data[key]/total) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(90,90);
    ctx.arc(90,90,80,start,start+slice);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    start += slice;
    legend.innerHTML += `<div><span class="swatch" style="background:${color}"></span>${name}: ${Math.round(data[key]/total*100)}%</div>`;
  });
}

// ====== GAME LOGIC ======
function baseLifeStagePrompt() {
  let stageDesc = "";
  if (state.age <= 3) stageDesc = "Giai đoạn sơ sinh: chỉ ăn chơi, không có quyết định tài chính.";
  else if (state.age <= 8) stageDesc = "Giai đoạn thiếu nhi: học tập, ăn, chơi. Không có thu nhập.";
  else if (state.age <= 17) stageDesc = "Giai đoạn thiếu niên: bắt đầu lo tương lai, chọn hướng học tập, chưa có thu nhập lớn.";
  else if (state.age === 18) stageDesc = "Bắt đầu vừa học đại học vừa đi làm thêm.";
  else if (state.age <= 20) stageDesc = "Đang học đại học + đi làm thêm, cần đóng học phí.";
  else if (state.age === 21) stageDesc = "Có thể tốt nghiệp nếu đã chăm học và đủ tiền học phí, hoặc chọn đi làm lương thấp, hoặc học lại.";
  else if (state.age < 30) stageDesc = "Người trưởng thành trẻ: đi làm, tích lũy, đầu tư, trả nợ.";
  else if (state.age < 35) stageDesc = "Áp lực kết hôn tăng cao, cần chi trả đám cưới, có thể nhận tiền mừng.";
  else if (state.age < 60) stageDesc = "Có thể có con, áp lực nuôi con và tài chính gia đình.";
  else if (state.age < 90) stageDesc = "Tuổi trung niên - cao niên: chuẩn bị nghỉ hưu, quản lý tài sản.";
  else stageDesc = "Cuối đời: chuẩn bị để lại tài sản/nợ cho thế hệ sau.";
  return stageDesc;
}

async function callGroqDecision() {
  const prompt = `
Bạn là một AI đang mô phỏng MỘT NĂM trong cuộc đời của một nhân vật, hiện tại nhân vật ${state.age} tuổi.
Giai đoạn hiện tại: ${baseLifeStagePrompt()}

Thông tin hiện tại:
- Tiền mặt: ${state.cash} VNĐ
- Tiết kiệm ngân hàng: ${state.savings} VNĐ
- Đầu tư chứng khoán: ${state.stock} VNĐ
- Nợ: ${state.debt} VNĐ (lãi suất ${state.interestRate}%/năm)
- Sức khỏe: ${state.health}/100
- Căng thẳng: ${state.stress}/100
- Công việc: ${state.job}, lương năm: ${state.salary}
- Đã kết hôn: ${state.married}, số con: ${state.children}
- Trình độ học vấn: ${state.eduLevel}
- Xu hướng thị trường chứng khoán năm nay: ${state.marketTrend}%
- Lạm phát năm nay: ${state.inflation}%

Hãy đưa ra quyết định cho năm nay dưới dạng JSON THUẦN (không markdown, không giải thích thêm) theo format:
{
  "narrative": "mô tả ngắn gọn 1-2 câu chuyện xảy ra năm nay bằng tiếng Việt",
  "job": "tên công việc mới hoặc giữ nguyên",
  "salary_change_pct": số phần trăm thay đổi lương (-100 đến 100),
  "action": "một trong: gửi_tiết_kiệm, đầu_tư_chứng_khoán, rút_chứng_khoán, vay_ngân_hàng, trả_nợ, nghỉ_ngơi, tăng_ca, học_thêm, kết_hôn, sinh_con, không_làm_gì",
  "amount": số tiền liên quan đến action (VNĐ, có thể 0),
  "time_split": {"sleep": %, "work": %, "overtime": %, "rest": %} (tổng = 100),
  "health_change": số thay đổi sức khỏe (-30 đến +20),
  "stress_change": số thay đổi căng thẳng (-20 đến +30)
}
Chỉ trả về JSON, không thêm gì khác.
`;

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [{ role: "user", content: prompt }],
        temperature: 0.9
      })
    });
    const data = await res.json();
    let text = data.choices?.[0]?.message?.content || "{}";
    text = text.replace(/```json|```/g,'').trim();
    return JSON.parse(text);
  } catch (e) {
    console.error("Groq error", e);
    return { narrative: "AI không thể quyết định năm nay (lỗi kết nối).", action: "không_làm_gì", amount:0, time_split:state.timeSplit, health_change:-5, stress_change:5, salary_change_pct:0, job: state.job };
  }
}

function applyEconomy() {
  // Thị trường chứng khoán biến động ngẫu nhiên
  state.marketTrend = Math.round((Math.random()*40 - 15)); // -15% đến +25%
  state.stock = state.stock * (1 + state.marketTrend/100);

  // Lãi suất ngân hàng tăng nhẹ theo lạm phát
  state.inflation = Math.max(1, Math.round(state.inflation + (Math.random()*4 - 2)));
  state.interestRate = Math.min(25, state.interestRate + (Math.random()*1 - 0.3));

  // Tiết kiệm tăng chậm
  state.savings = state.savings * (1 + 0.05);

  // Nợ tăng theo lãi suất
  if (state.debt > 0) {
    state.debt = state.debt * (1 + state.interestRate/100);
  }
}

async function tick() {
  if (state.age > 100) {
    endLife();
    return;
  }

  applyEconomy();
  const decision = await callGroqDecision();

  // Áp dụng quyết định
  if (decision.job) state.job = decision.job;
  if (decision.salary_change_pct) {
    state.salary = state.salary * (1 + decision.salary_change_pct/100);
    if (state.salary < 0) state.salary = 0;
  }
  state.cash += state.salary; // nhận lương năm

  const amt = Number(decision.amount) || 0;
  switch (decision.action) {
    case "gửi_tiết_kiệm":
      state.cash -= amt; state.savings += amt; break;
    case "đầu_tư_chứng_khoán":
      state.cash -= amt; state.stock += amt; break;
    case "rút_chứng_khoán":
      state.stock -= amt; state.cash += amt; break;
    case "vay_ngân_hàng":
      state.debt += amt; state.cash += amt; break;
    case "trả_nợ":
      state.debt = Math.max(0, state.debt - amt); state.cash -= amt; break;
    case "kết_hôn":
      state.married = true;
      state.cash -= amt; // chi phí đám cưới
      const giftMoney = Math.round(Math.random()*50000000);
      state.cash += giftMoney;
      log(`💍 Kết hôn! Chi phí đám cưới: ${fmt(amt)} VNĐ, tiền mừng nhận được: ${fmt(giftMoney)} VNĐ`);
      break;
    case "sinh_con":
      state.children += 1;
      state.cash -= amt;
      break;
  }

  if (decision.time_split) state.timeSplit = decision.time_split;
  state.health = Math.min(100, Math.max(0, state.health + (Number(decision.health_change)||0)));
  state.stress = Math.min(100, Math.max(0, state.stress + (Number(decision.stress_change)||0)));

  log(decision.narrative || "Không có sự kiện đặc biệt năm nay.");

  // Đột quỵ nếu sức khỏe quá thấp
  if (state.health < 20) {
    if (Math.random() < 0.4) {
      log("🚨 ĐỘT QUỴ do sức khỏe quá yếu và không nghỉ ngơi đầy đủ!", true);
      endLife();
      return;
    } else {
      log("⚠️ Sức khỏe nguy hiểm! Cần nghỉ ngơi ngay hoặc sẽ đột quỵ.", true);
    }
  }

  state.age += 1;
  updateUI();
}

function endLife() {
  stop();
  log(`☠️ Kết thúc cuộc đời ở tuổi ${state.age}. Tài sản để lại: ${fmt(state.cash+state.savings+state.stock)} VNĐ, Nợ để lại: ${fmt(state.debt)} VNĐ`, true);

  // Thế hệ tiếp theo thừa kế
  const inheritance = state.cash + state.savings + state.stock;
  const inheritedDebt = state.debt;

  state = {
    generation: state.generation + 1,
    age: 1,
    cash: inheritance,
    savings: 0,
    stock: 0,
    debt: inheritedDebt,
    interestRate: 5 + Math.random()*3,
    health: 100,
    stress: 0,
    job: "Chưa có việc",
    salary: 0,
    status: "Ngủ",
    married: false,
    children: 0,
    eduLevel: "Chưa học",
    marketTrend: 0,
    inflation: 3,
    timeSplit: { sleep: 40, work: 30, overtime: 10, rest: 20 },
    history: []
  };
  log(`👶 Thế hệ mới #${state.generation} bắt đầu, thừa kế ${fmt(inheritance)} VNĐ và ${fmt(inheritedDebt)} VNĐ nợ.`);
  updateUI();
  start(); // tự động tiếp tục thế hệ mới
}

function start() {
  if (running) return;
  running = true;
  el('startBtn').disabled = true;
  el('pauseBtn').disabled = false;
  timer = setInterval(tick, TICK_MS);
  tick(); // chạy ngay lượt đầu
}
function stop() {
  running = false;
  el('startBtn').disabled = false;
  el('pauseBtn').disabled = true;
  clearInterval(timer);
}
function reset() {
  stop();
  location.reload();
}

el('startBtn').onclick = start;
el('pauseBtn').onclick = stop;
el('resetBtn').onclick = reset;

updateUI();
log("Chào mừng đến với Mô Phỏng Cuộc Đời AI. Nhấn Bắt đầu để khởi động.");
</script>
</body>
</html>
